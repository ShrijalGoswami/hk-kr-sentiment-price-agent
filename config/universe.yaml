# Pipeline universe and run settings. Everything a reviewer may want to change lives here.

window_days: 10          # social/news look-back required by the brief
interval: 60m            # price bar size: 60m (default) or 1d. "n+1" is the next bar at this size.
post_latency_minutes: 5  # a post only becomes usable this long after it was written

actors:
  lihkg: claude_code_reviewer/lihkg-scraper-en
  naver: hgservices/naver-stock-discussion-scraper
  telegram: automation-lab/telegram-scraper

limits:                  # sized so two full runs fit the Apify free tier ($5/month): ours and a reviewer's
  lihkg_search_per_keyword: 20
  lihkg_threads_per_ticker: 2
  lihkg_replies_per_thread: 10
  naver_posts_per_ticker: 75
  telegram_messages_per_channel: 50
  max_usd_per_actor_run: 1.0
  exa_results_per_query: 12

sentiment:
  backend: auto          # auto | transformer | lexicon
  neutral_band: 0.10     # |score| below this is reported as Neutral
  ewm_halflife_bars: 6
  prior_weight: 2.0      # shrinks thin-data sentiment toward zero

model:
  champion: ridge_full   # fixed before looking at results, so the headline number is not cherry-picked
  min_train_rows: 150
  refit_every_steps: 3
  embargo_bars: 1
  permutations: 100
  gate_max_p_value: 0.10 # a position is only taken if the champion beats random-walk OOS at this level

exchanges:
  HKEX:
    label: Hong Kong Exchange
    tz: Asia/Hong_Kong
    index: "^HSI"
    currency: HKD
    sessions: [["09:30", "12:00"], ["13:00", "16:00"]]
    closing_auction_minutes: 10
    last_bar_label: "15:30"
    round_trip_cost_bps: 25   # stamp duty 0.1% each way + levies and commission
    social_sources: [lihkg, telegram]
    telegram_channels: [StockIntelligence, Financial_Express, eco_cn, Kennywen, times001]
